{% extends "base.html" %}

{% block title %}Hapus Riwayat - Tanem{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Hapus riwayat?</h1>
    <p>Riwayat <strong>{{ history.land_name }}</strong> akan dihapus permanen.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn--primary">Ya, hapus</button>
    </form>
    <p class="auth-card__switch"><a href="{% url 'recommendations:history_detail' history.pk %}">Batal</a></p>
</section>
{% endblock %}
